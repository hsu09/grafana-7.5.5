name: Build Grafana RPM

on:
  workflow_dispatch:
  push:
    branches:
      - fix_v14
    paths:
      - '.github/workflows/build-rpm.yml'
      - 'pkg/tsdb/sqleng/**'
      - 'pkg/api/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'yarn.lock'
      - 'public/app/plugins/panel/table/**'
      - 'public/app/plugins/panel/dashlist/**'
      - 'packages/grafana-ui/src/components/Table/**'
      - 'public/app/plugins/datasource/mysql/**'
      - 'public/app/plugins/datasource/postgres/**'
      - 'public/app/plugins/datasource/mssql/**'
      - 'build.go'
      - 'scripts/**'
      - 'packaging/**'

permissions:
  contents: read

jobs:
  build-rpm:
    name: Build Grafana 7.5.5 fix-v14 linux x64 RPM
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      BUILD_ID: 755${{ github.run_number }}
      GRAFANA_BUILD_CONTAINER: grafana/build-container:1.4.1
      GO_VERSION: 1.15.15
      YARN_CACHE_FOLDER: /go/src/github.com/grafana/grafana/.cache/yarn

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Grafana build tool
        run: |
          set -euxo pipefail

          docker run --rm \
            -e DRONE_BUILD_NUMBER="${BUILD_ID}" \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -e YARN_CACHE_FOLDER="${YARN_CACHE_FOLDER}" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail

              mkdir -p bin
              curl -fL -o bin/grabpl https://grafana-downloads.storage.googleapis.com/grafana-build-pipeline/v0.5.43/grabpl
              chmod +x bin/grabpl
            '

      - name: Install Go 1.15 toolchain
        run: |
          set -euxo pipefail

          docker run --rm \
            -e GO_VERSION="${GO_VERSION}" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              rm -rf .tools/go
              mkdir -p .tools
              curl -fL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
              tar -C .tools -xzf /tmp/go.tgz
              .tools/go/bin/go version
            '

      - name: Install frontend dependencies
        run: |
          set -euxo pipefail

          docker run --rm \
            -e DRONE_BUILD_NUMBER="${BUILD_ID}" \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -e YARN_CACHE_FOLDER="${YARN_CACHE_FOLDER}" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              rm -rf "${YARN_CACHE_FOLDER}"
              mkdir -p "${YARN_CACHE_FOLDER}"

              for attempt in 1 2 3; do
                if yarn install --pure-lockfile --no-progress --network-timeout 100000 --cache-folder "${YARN_CACHE_FOLDER}"; then
                  exit 0
                fi

                echo "yarn install failed on attempt ${attempt}; clearing cache before retry"
                rm -rf "${YARN_CACHE_FOLDER}"
                mkdir -p "${YARN_CACHE_FOLDER}"
                sleep 10
              done

              exit 1
            '

      - name: Check and test dashboard order-last sorting
        run: |
          set -euxo pipefail

          docker run --rm \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              yarn prettier --check public/app/plugins/panel/dashlist/DashList.tsx public/app/plugins/panel/dashlist/sort.ts public/app/plugins/panel/dashlist/sort.test.ts
              yarn jest public/app/plugins/panel/dashlist/sort.test.ts --ci --runInBand
            '

      - name: Build backend
        run: |
          set -euxo pipefail

          docker run --rm \
            -e DRONE_BUILD_NUMBER="${BUILD_ID}" \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -e GOROOT="/go/src/github.com/grafana/grafana/.tools/go" \
            -e YARN_CACHE_FOLDER="${YARN_CACHE_FOLDER}" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              export PATH="${GOROOT}/bin:${PATH}"
              go version
              ./bin/grabpl build-backend --jobs 4 --edition oss --build-id "${DRONE_BUILD_NUMBER}" --variants linux-x64 --no-pull-enterprise
            '

      - name: Test streaming Excel export
        run: |
          set -euxo pipefail

          docker run --rm \
            -e GOROOT="/go/src/github.com/grafana/grafana/.tools/go" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              export PATH="${GOROOT}/bin:${PATH}"
              go test ./pkg/api -run "Test(SplitTableExportSheets|WriteTableExportWorkbook|BuildTableCountSQL|TableCountValue)$" -count=1
              go test ./pkg/tsdb/sqleng -run "TestTableQueryRowLimit$" -count=1
            '

      - name: Build frontend
        run: |
          set -euxo pipefail

          docker run --rm \
            -e DRONE_BUILD_NUMBER="${BUILD_ID}" \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -e GOROOT="/go/src/github.com/grafana/grafana/.tools/go" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              export PATH="${GOROOT}/bin:${PATH}"
              ./bin/grabpl build-frontend --jobs 4 --edition oss --build-id "${DRONE_BUILD_NUMBER}" --no-install-deps --no-pull-enterprise
            '

      - name: Build plugins
        run: |
          set -euxo pipefail

          docker run --rm \
            -e DRONE_BUILD_NUMBER="${BUILD_ID}" \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              ./bin/grabpl build-plugins --jobs 4 --edition oss --no-install-deps
            '

      - name: Remove incomplete core plugin dist directories
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail

              # Grafana 7.5.5 scans only a plugin dist directory when one
              # exists. Some build steps leave incomplete dist trees without
              # plugin.json, so the root manifest is skipped and built-in
              # plugins such as MySQL are not registered at runtime.
              mapfile -d "" dist_dirs < <(find public/app/plugins -type d -name dist -print0)
              for dist_dir in "${dist_dirs[@]}"; do
                if [[ ! -f "${dist_dir}/plugin.json" ]]; then
                  echo "Removing incomplete core plugin tree: ${dist_dir}"
                  rm -rf "${dist_dir}"
                fi
              done

              test -f public/app/plugins/datasource/mysql/plugin.json
              test ! -d public/app/plugins/datasource/mysql/dist
            '

      - name: Generate package version
        run: |
          set -euxo pipefail

          docker run --rm \
            -e DRONE_BUILD_NUMBER="${BUILD_ID}" \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -e GOROOT="/go/src/github.com/grafana/grafana/.tools/go" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              export PATH="${GOROOT}/bin:${PATH}"
              ./bin/grabpl gen-version --build-id "${DRONE_BUILD_NUMBER}"
            '

      - name: Package RPM
        run: |
          set -euxo pipefail

          docker run --rm \
            -e DRONE_BUILD_NUMBER="${BUILD_ID}" \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e NODE_OPTIONS="--max_old_space_size=4096" \
            -e GOROOT="/go/src/github.com/grafana/grafana/.tools/go" \
            -v "${GITHUB_WORKSPACE}:/go/src/github.com/grafana/grafana" \
            -w /go/src/github.com/grafana/grafana \
            "${GRAFANA_BUILD_CONTAINER}" \
            bash -lc '
              set -euxo pipefail
              export PATH="${GOROOT}/bin:${PATH}"
              . scripts/build/gpg-test-vars.sh
              ./bin/grabpl package --jobs 4 --edition oss --build-id "${DRONE_BUILD_NUMBER}" --no-pull-enterprise --variants linux-x64

              find dist -maxdepth 1 -type f -name "*.rpm" -ls

              rpm_file="$(find dist -maxdepth 1 -type f -name "*.rpm" -print -quit)"
              test -n "${rpm_file}"
              rpm -qpl "${rpm_file}" | grep -Fx "/usr/share/grafana/public/app/plugins/datasource/mysql/plugin.json"
              if rpm -qpl "${rpm_file}" | grep -q "^/usr/share/grafana/public/app/plugins/datasource/mysql/dist"; then
                echo "MySQL contains an incomplete dist tree and would not be registered"
                exit 1
              fi
            '

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: grafana-7.5.5-fix-v14-order-last-rpm
          path: |
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
